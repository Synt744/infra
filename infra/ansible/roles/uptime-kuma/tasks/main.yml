---
# uptime-kuma — мониторинг аптайма всех сервисов

- name: Create Uptime Kuma stack directory
  ansible.builtin.file:
    path: "{{ uptime_kuma_stack_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [uptime-kuma]

- name: Create Uptime Kuma data directory
  ansible.builtin.file:
    path: "{{ uptime_kuma_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [uptime-kuma]

- name: Deploy Uptime Kuma docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ uptime_kuma_stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Uptime Kuma
  tags: [uptime-kuma, config]

- name: Start Uptime Kuma
  community.docker.docker_compose_v2:
    project_src: "{{ uptime_kuma_stack_dir }}"
    state: present
    pull: policy
  tags: [uptime-kuma]
