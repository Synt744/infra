---
- name: Verify firewall role
  hosts: all
  become: true
  tasks:
    - name: Check ufw is installed
      ansible.builtin.package_facts:
        manager: apt

    - name: Assert ufw is installed
      ansible.builtin.assert:
        that: "'ufw' in ansible_facts.packages"
        fail_msg: "ufw is not installed"

    - name: Check ufw status
      ansible.builtin.command: ufw status
      register: ufw_status
      changed_when: false

    - name: Assert ufw is active
      ansible.builtin.assert:
        that: "'Status: active' in ufw_status.stdout"
        fail_msg: "UFW is not active"

    - name: Assert SSH rule is present
      ansible.builtin.assert:
        that: "'22/tcp' in ufw_status.stdout or 'OpenSSH' in ufw_status.stdout"
        fail_msg: "SSH rule is missing from UFW"
