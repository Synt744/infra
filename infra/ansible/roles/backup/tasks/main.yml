---
# backup — Restic резервное копирование

- name: Install Restic
  ansible.builtin.apt:
    name: restic
    state: present
  tags: [backup]

- name: Create backup scripts directory
  ansible.builtin.file:
    path: /etc/restic
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: [backup]

- name: Deploy Restic environment file (secrets)
  ansible.builtin.template:
    src: restic.env.j2
    dest: /etc/restic/restic.env
    owner: root
    group: root
    mode: "0600"
  tags: [backup, config]

- name: Deploy backup script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: /etc/restic/backup.sh
    owner: root
    group: root
    mode: "0750"
  tags: [backup, config]

- name: Deploy systemd backup service
  ansible.builtin.template:
    src: restic-backup.service.j2
    dest: /etc/systemd/system/restic-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [backup, systemd]

- name: Deploy systemd backup timer
  ansible.builtin.template:
    src: restic-backup.timer.j2
    dest: /etc/systemd/system/restic-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Enable backup timer
  tags: [backup, systemd]

- name: Initialize Restic repository if not exists
  ansible.builtin.shell: |
    set -a; source /etc/restic/restic.env; set +a
    restic snapshots --no-lock 2>/dev/null || restic init
  changed_when: false
  tags: [backup]
