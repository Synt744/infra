---
name: Ansible Lint & Syntax Check

on:
  push:
    paths:
      - "infra/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/lint.yml"

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -c infra/.yamllint infra/
        working-directory: ${{ github.workspace }}

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    needs: yamllint
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible + ansible-lint
        run: |
          pip install ansible ansible-lint

      - name: Install required collections
        run: |
          ansible-galaxy collection install community.docker community.general
        working-directory: infra

      - name: Run ansible-lint
        run: ansible-lint
        working-directory: infra

  syntax-check:
    name: Syntax Check (all profiles)
    runs-on: ubuntu-latest
    needs: ansible-lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible

      - name: Install required collections
        run: |
          ansible-galaxy collection install community.docker community.general
        working-directory: infra

      - name: Syntax check — workstation profile
        run: |
          ansible-playbook profiles/workstation.yml \
            --inventory ansible/inventories/local/hosts.yml \
            --syntax-check \
            --extra-vars "@.github/ci-vault.yml"
        working-directory: infra

      - name: Syntax check — server profile
        run: |
          ansible-playbook profiles/server.yml \
            --inventory ansible/inventories/local/hosts.yml \
            --syntax-check \
            --extra-vars "@.github/ci-vault.yml"
        working-directory: infra

      - name: Syntax check — laptop profile
        run: |
          ansible-playbook profiles/laptop.yml \
            --inventory ansible/inventories/local/hosts.yml \
            --syntax-check \
            --extra-vars "@.github/ci-vault.yml"
        working-directory: infra

      - name: Syntax check — raspberry profile
        run: |
          ansible-playbook profiles/raspberry.yml \
            --inventory ansible/inventories/local/hosts.yml \
            --syntax-check \
            --extra-vars "@.github/ci-vault.yml"
        working-directory: infra
